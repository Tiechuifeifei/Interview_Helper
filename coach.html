<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Coach dashboard · Interview Coach</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/coach.css">
  <script src="vendor/supabase/supabase.js"></script>
</head>
<body class="coach">
  <div id="demo"></div>
  <header class="c-bar">
    <a href="index.html" class="brand">Interview Coach <span>· Coach</span></a>
    <span id="who"></span>
  </header>
  <div class="c-layout">
    <aside class="c-list">
      <div class="c-filter seg" id="filter">
        <button data-f="submitted" class="on">To review</button>
        <button data-f="reviewed">Sent</button>
        <button data-f="all">All</button>
      </div>
      <div id="list"></div>
    </aside>
    <main class="c-detail" id="detail">
      <div class="c-empty">Select a submission to review.</div>
    </main>
  </div>
  <script type="module" src="js/coach.js"></script>
</body>
</html>
